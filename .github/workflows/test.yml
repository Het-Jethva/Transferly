name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Lint release build
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Lint fault-injection build
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags transferly_faults

  process-suite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Built-executable process and package tests
        run: go test ./...

  adversarial-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Race detector
        run: go test -race ./...
      - name: Framing fuzz smoke
        run: go test ./internal/session -run=^$ -fuzz=^FuzzProtocolFrameLengthHandling$ -fuzztime=5s
      - name: Verification-code fuzz smoke
        run: go test ./internal/session -run=^$ -fuzz=^FuzzVerificationCodeDerivation$ -fuzztime=5s
      - name: Path-confinement fuzz smoke
        run: go test ./internal/terminal -run=^$ -fuzz=^FuzzManifestPathConfinement$ -fuzztime=5s
      - name: Conflict-name fuzz smoke
        run: go test ./internal/terminal -run=^$ -fuzz=^FuzzConflictNameGeneration$ -fuzztime=5s
      - name: Manifest-limit fuzz smoke
        run: go test ./internal/terminal -run=^$ -fuzz=^FuzzTransferOfferManifestLimits$ -fuzztime=5s
      - name: Throughput benchmark evidence
        run: go test ./internal/session -run=^$ -bench=^BenchmarkThroughput$ -benchtime=1x -benchmem

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Collect coverage from real Transferly processes
        run: |
          mkdir -p covdata
          TRANSFERLY_COVERDIR="$PWD/covdata" go test ./... -coverpkg=./internal/...,./cmd/...
          go tool covdata percent -i=covdata
      - name: Publish coverage summary
        run: |
          {
            echo '### Coverage from process-level integration suite'
            echo
            echo '```'
            go tool covdata func -i=covdata | tail -1
            go tool covdata percent -i=covdata
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  portable-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Reproducible Windows x64 build
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version v0.0.0-ci -OutputDirectory dist
      - name: Installer-free and persistence check
        shell: pwsh
        run: ./scripts/verify-portable.ps1 -Executable dist/transferly-windows-amd64.exe -ExpectedVersion v0.0.0-ci
