name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Process suite and race detector
        run: go test -race ./...
      - name: Targeted fuzz smoke tests
        run: |
          go test ./internal/session -run=^$ -fuzz=^FuzzProtocolFrameLengthHandling$ -fuzztime=5s
          go test ./internal/session -run=^$ -fuzz=^FuzzVerificationCodeDerivation$ -fuzztime=5s
          go test ./internal/terminal -run=^$ -fuzz=^FuzzManifestPathConfinement$ -fuzztime=5s
          go test ./internal/terminal -run=^$ -fuzz=^FuzzConflictNameGeneration$ -fuzztime=5s
          go test ./internal/terminal -run=^$ -fuzz=^FuzzTransferOfferManifestLimits$ -fuzztime=5s
      - name: Benchmark evidence
        run: go test ./internal/session -run=^$ -bench=^BenchmarkThroughput$ -benchtime=1x -benchmem

  windows-release:
    needs: quality-gates
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Test public behavior
        shell: pwsh
        run: go test ./...
      - name: Build reproducible portable Windows payload
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -OutputDirectory dist
      - name: Check portable artifact
        shell: pwsh
        run: ./scripts/verify-portable.ps1 -Executable dist/transferly-windows-amd64.exe -ExpectedVersion $env:RELEASE_VERSION
      - name: Detect signing credentials
        id: credentials
        shell: pwsh
        run: |
          $available = -not ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
                             [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD))
          "signed=$($available.ToString().ToLowerInvariant())" |
            Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Host '::warning::No Windows signing credentials are configured; publishing an unsigned artifact with SHA-256 checksums.'
          }
      - name: Sign and verify Authenticode
        if: steps.credentials.outputs.signed == 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'transferly-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            ./scripts/sign-release.ps1 `
              -Executable dist/transferly-windows-amd64.exe `
              -PfxPath $pfx `
              -PfxPassword $env:SIGNING_CERTIFICATE_PASSWORD
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
          $signature = Get-AuthenticodeSignature dist/transferly-windows-amd64.exe
          if ($signature.Status -ne 'Valid') { throw "signature status is $($signature.Status); refusing to publish" }
      - name: Checksum and re-verify the published artifact
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/transferly-windows-amd64.exe).Hash.ToLowerInvariant()
          "$hash  transferly-windows-amd64.exe" |
            Set-Content -Encoding ascii -NoNewline dist/transferly-windows-amd64.exe.sha256
          ./scripts/verify-portable.ps1 -Executable dist/transferly-windows-amd64.exe -ExpectedVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: transferly-${{ env.RELEASE_VERSION }}-windows-amd64-${{ steps.credentials.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: |
            dist/transferly-windows-amd64.exe
            dist/transferly-windows-amd64.exe.sha256
          if-no-files-found: error
      - name: Describe artifact trust
        id: trust
        shell: pwsh
        run: |
          if ('${{ steps.credentials.outputs.signed }}' -eq 'true') {
            $lines = @(
              'This artifact is Authenticode-signed. Verify it before running:',
              '',
              '```powershell',
              'Get-AuthenticodeSignature transferly-windows-amd64.exe',
              '```'
            )
          } else {
            $lines = @(
              '> **This artifact is not Authenticode-signed.** SmartScreen will warn on first run.',
              '> Verify the download against the published SHA-256 before running it:',
              '',
              '```powershell',
              'Get-FileHash -Algorithm SHA256 transferly-windows-amd64.exe',
              '```'
            )
          }
          $note = $lines -join "`n"
          "note<<EOF"  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $note        | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "EOF"        | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Publish tag release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/transferly-windows-amd64.exe
            dist/transferly-windows-amd64.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: ${{ steps.trust.outputs.note }}
