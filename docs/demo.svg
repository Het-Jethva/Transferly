<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .bg    { fill: #0d1117; }
    .pane  { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
    .bar   { fill: #21262d; }
    .title { fill: #8b949e; font-size: 11px; }
    .t     { fill: #c9d1d9; font-size: 11.5px; }
    .dim   { fill: #6e7681; font-size: 11.5px; }
    .cmd   { fill: #79c0ff; font-size: 11.5px; }
    .ok    { fill: #3fb950; font-size: 11.5px; }
    .code  { fill: #f0883e; font-size: 13px; font-weight: bold; }
    .cap   { fill: #6e7681; font-size: 11px; }
  </style>

  <rect class="bg" width="1000" height="540" rx="10"/>

  <!-- Sender pane -->
  <rect class="pane" x="16" y="16" width="475" height="470"/>
  <rect class="bar" x="16" y="16" width="475" height="26" rx="8"/>
  <rect class="bar" x="16" y="34" width="475" height="8"/>
  <circle cx="32" cy="29" r="4" fill="#ff5f56"/>
  <circle cx="46" cy="29" r="4" fill="#ffbd2e"/>
  <circle cx="60" cy="29" r="4" fill="#27c93f"/>
  <text class="title" x="76" y="33">ALICE-LAPTOP — sender</text>

  <g transform="translate(30,62)">
    <text class="cmd"  y="0">$ transferly --name ALICE-LAPTOP --listen 127.0.0.1:0</text>
    <text class="t"    y="19">Transferly v1.0.0 (wire protocol 3.0)</text>
    <text class="t"    y="38">Endpoint: 127.0.0.1:52575</text>
    <text class="cmd"  y="72">&gt; connect 127.0.0.1:52576</text>
    <text class="t"    y="91">Connecting to 127.0.0.1:52576...</text>
    <text class="code" y="113">Verification code: 127795</text>
    <text class="dim"  y="132">Compare this code with the other Peer. Type yes</text>
    <text class="dim"  y="149">if it matches, or no if it does not.</text>
    <text class="cmd"  y="171">&gt; yes</text>
    <text class="ok"   y="190">Transfer Session verified with 127.0.0.1:52576.</text>
    <text class="cmd"  y="224">&gt; send quarterly-report.pdf notes</text>
    <text class="t"    y="243">Transfer Offer sent: 2 roots (8871 bytes).</text>
    <text class="dim"  y="262">Sending quarterly-report.pdf: 8802/8802 bytes</text>
    <text class="dim"  y="281">Rate: 6.9 MiB/s | ETA: 0s | Active files: 1</text>
    <text class="t"    y="308">Item succeeded: quarterly-report.pdf (1/3)</text>
    <text class="t"    y="327">Item succeeded: notes/outline.md (2/3)</text>
    <text class="t"    y="346">Item succeeded: notes/summary.txt (3/3)</text>
    <text class="ok"   y="371">Transfer complete: 3 files, 1 folders (8871 bytes).</text>
    <text class="dim"  y="400">Transferly stopped. No identity or trust was saved.</text>
  </g>

  <!-- Receiver pane -->
  <rect class="pane" x="509" y="16" width="475" height="470"/>
  <rect class="bar" x="509" y="16" width="475" height="26" rx="8"/>
  <rect class="bar" x="509" y="34" width="475" height="8"/>
  <circle cx="525" cy="29" r="4" fill="#ff5f56"/>
  <circle cx="539" cy="29" r="4" fill="#ffbd2e"/>
  <circle cx="553" cy="29" r="4" fill="#27c93f"/>
  <text class="title" x="569" y="33">BOB-DESKTOP — receiver</text>

  <g transform="translate(523,62)">
    <text class="cmd"  y="0">$ transferly --name BOB-DESKTOP --listen 127.0.0.1:0</text>
    <text class="t"    y="19">Transferly v1.0.0 (wire protocol 3.0)</text>
    <text class="t"    y="38">Endpoint: 127.0.0.1:52576</text>
    <text class="t"    y="72">Incoming connection from 127.0.0.1:52577.</text>
    <text class="code" y="113">Verification code: 127795</text>
    <text class="dim"  y="132">Compare this code with the other Peer. Type yes</text>
    <text class="dim"  y="149">if it matches, or no if it does not.</text>
    <text class="cmd"  y="171">&gt; yes</text>
    <text class="ok"   y="190">Transfer Session verified with 127.0.0.1:52577.</text>
    <text class="t"    y="224">Transfer Offer: 2 top-level roots, 3 files,</text>
    <text class="t"    y="241">1 folders (8871 bytes)</text>
    <text class="dim"  y="260">Choose accept, reject, destination &lt;path&gt;, or details.</text>
    <text class="cmd"  y="282">&gt; accept</text>
    <text class="t"    y="301">Transfer Offer accepted. Waiting for file content.</text>
    <text class="t"    y="323">Received quarterly-report.pdf (8802 bytes)</text>
    <text class="t"    y="342">Received notes/outline.md (38 bytes)</text>
    <text class="t"    y="361">Received notes/summary.txt (31 bytes)</text>
    <text class="ok"   y="386">Received Transfer Offer: 3 files, 1 folders (8871 bytes)</text>
    <text class="dim"  y="415">Transferly stopped. No identity or trust was saved.</text>
  </g>

  <text class="cap" x="16" y="506">Captured from two real Transferly processes over loopback.</text>
  <text class="cap" x="16" y="522">The six-digit code is derived from the TLS 1.3 key exporter, so it matches only when no attacker sits between the two Peers.</text>
</svg>
